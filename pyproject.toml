[project]
name = "wg21-paperflow"
version = "0.4.1"
description = "WG21 paper ingestion and conversion: paperstore + mailing + tomd + cli"
requires-python = ">=3.12"
license = {text = "BSL-1.0"}
authors = [{name = "Vinnie Falco", email = "vinnie.falco@gmail.com"}]
dependencies = [
    "paperstore",
    "mailing",
    "tomd",
    "pipeline",
    "agora",
    "assay",
    "cli",
    "preview",
    "cpp-mcp",
    "calibrate",
]

[dependency-groups]
# Pillow is test-only: tomd's vector-fixture aHash test uses PIL.Image
# for 8x8 perceptual comparison. Not loaded at runtime - whiteout uses
# pymupdf.Pixmap.set_rect directly. Keeping Pillow out of any package's
# [project.dependencies] avoids cross-codec linkage (zlib/libjpeg/libpng)
# drift between pymupdf and Pillow at install time.
# markdown-it-py is also test-only: tomd's list-item-nesting tests render the
# produced markdown through a real CommonMark parser to assert block nesting.
# It was only transitively present (via rich); declared+pinned here because the
# tests assert rendering behavior, which can drift across parser versions.
dev = [
    "pytest~=8.0",
    "ruff~=0.6",
    "pyright>=1.1",
    "pillow>=11.0",
    "markdown-it-py~=4.0",
    "pipeline[train]",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
paperstore   = {workspace = true}
mailing      = {workspace = true}
tomd         = {workspace = true}
pipeline     = {workspace = true}
agora        = {workspace = true}
assay        = {workspace = true}
cli          = {workspace = true}
preview      = {workspace = true}
cpp-mcp      = {workspace = true}
calibrate    = {workspace = true}
scrivener  = {git = "https://github.com/gregjkal/wg21-scrivener.git"}

[tool.pytest.ini_options]
testpaths = [
    "packages/paperstore/tests",
    "packages/mailing/tests",
    "packages/tomd/tests",
    "packages/pipeline/tests",
    "packages/agora/tests",
    "packages/assay/tests",
    "packages/cli/tests",
    "packages/preview/tests",
    "packages/cpp-mcp/tests",
    "packages/calibrate/tests",
    "tests",
]
markers = [
    "network: tests that hit the live network; deselected by default (run with -m network)",
]
addopts = "-m 'not network'"

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
include = ["packages"]
exclude = ["**/tests/**"]
reportPrivateImportUsage = "warning"
reportOptionalMemberAccess = "warning"

[tool.ruff.lint.per-file-ignores]
# Tests intentionally:
#   F811: re-export pytest fixtures with `from x import store  # noqa: F401`
#         then take `store` as a parameter, which ruff reads as redefinition.
#   F841: assign to a variable to call a function for its side effects, then
#         assert on the side-effected object instead of the return value.
#   E741: use single-letter `l` as a stand-in for `line` in tight scopes.
#   E402: insert sys.path before importing the package under test when run
#         as a script (test_emit).
"**/tests/**" = ["F811", "F841", "E741", "E402"]
