[project]
name = "calibrate"
version = "0.1.0"
description = "Calibration harness for the paperweight prompt: full runs, replay, metrics and comparison"
requires-python = ">=3.12"
license = {text = "BSL-1.0"}
authors = [{name = "sykosyber", email = "mateorobles100@icloud.com"}]
# lupa 2.8 is the first release that ships Lua 5.5, which Runvil links.
dependencies = [
    "lupa>=2.8,<3",
]

[project.scripts]
calibrate = "calibrate.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/calibrate"]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.ruff.lint.per-file-ignores]
# The probe is kept exactly as it was handed over: reference, not production.
"scripts/lua_shim_probe.py" = ["E401", "E701", "E702", "E741"]
"tests/**" = ["F811", "F841", "E741", "E402"]
